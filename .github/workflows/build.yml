name: Development build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Let an active release finish uploading its assets.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # The supplied project has no Wrapper. Pin Gradle rather than using the runner default.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Temporary workflow for the original repository, before the refactoring patches are pushed.
      # Explicitly override org.gradle.configuration-cache=true without modifying gradle.properties.
      # Restore the two cached build/versionInfo steps after pushing the fixed build.gradle.
      - name: Build original development version
        run: gradle --no-daemon --stacktrace --no-configuration-cache -Dorg.gradle.jvmargs=-Xmx3G build

      - name: Upload development JAR
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: astral-craft-dev-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
            !build/libs/*-tests.jar
            !build/libs/*-test.jar
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Write build artifact instructions
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          {
            echo '### Astral Craft 构建产物'
            echo
            echo "提交：\`$BUILD_SHA\`"
            echo
            echo "[下载 Actions 构建产物]($ARTIFACT_URL)（需要登录 GitHub）"
            echo
            echo '解压下载的 ZIP，将其中的模组 JAR 放进 Minecraft 26.1.2 / NeoForge 实例的 mods 文件夹。'
            echo '默认分支构建成功后，发布任务会提供 Releases 下载入口。PR 和其他分支仅保留 Actions 产物。'
            echo 'Actions 产物保留 30 天，实际期限受仓库设置限制。'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish development release
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download this build's JAR
        uses: actions/download-artifact@v5
        with:
          name: astral-craft-dev-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
          path: release-assets

      - name: Publish development prerelease
        id: release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: dev-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: "Astral Craft 开发构建 #${{ github.run_number }}.${{ github.run_attempt }}"
          prerelease: true
          make_latest: 'false'
          fail_on_unmatched_files: true
          files: release-assets/*.jar
          body: |
            这是开发体验版本。

            **下载方法：** 展开下方 Assets，点击 `.jar` 文件下载。公开仓库无需 GitHub 账号。
            将下载的 JAR 放入游戏实例的 `mods` 文件夹；不要下载自动生成的 Source code 压缩包。

            - Minecraft：26.1.2
            - NeoForge：26.1.2.75
            - Java：25
            - 客户端与服务器请使用同一次构建。
            - 对应提交：`${{ github.sha }}`
            - [构建记录](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Write public download instructions
        shell: bash
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          {
            echo '### Astral Craft 开发版已发布'
            echo
            echo "[前往 Releases 下载 JAR]($RELEASE_URL)"
            echo
            echo '公开仓库无需 GitHub 账号；展开 Assets 后下载 .jar 文件，放入 mods 文件夹。'
          } >> "$GITHUB_STEP_SUMMARY"
