name: Development build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # The supplied project has no Wrapper. Pin Gradle rather than using the runner default.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build and check
        run: gradle --no-daemon --stacktrace --configuration-cache --configuration-cache-problems=fail -Dorg.gradle.jvmargs=-Xmx3G build versionInfo

      # Repeat the same task graph to exercise actions after configuration-cache restoration.
      - name: Check build with reused configuration cache
        run: gradle --no-daemon --stacktrace --configuration-cache --configuration-cache-problems=fail -Dorg.gradle.jvmargs=-Xmx3G build versionInfo

      - name: Upload development JAR
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: astral-craft-dev-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
            !build/libs/*-tests.jar
            !build/libs/*-test.jar
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Write download instructions
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          {
            echo '### Astral Craft 开发构建'
            echo
            echo "提交：\`$BUILD_SHA\`"
            echo
            echo "[下载开发构建]($ARTIFACT_URL)（需要登录 GitHub）"
            echo
            echo '解压下载的 ZIP，将其中的模组 JAR 放进 Minecraft 26.1.2 / NeoForge 实例的 mods 文件夹。'
            echo 'Java 版本：25。客户端与服务器请使用同一构建。产物保留 30 天，实际期限受仓库设置限制。'
          } >> "$GITHUB_STEP_SUMMARY"
